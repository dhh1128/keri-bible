      only the cited passages of coring.py/eventing.py/parsing.py; vdr/eventing.py and app/habbing.py were
      NOT re-read. raw/16 read the presentation-registry paths of ipexing.py and regeventing.py; raw/15
      read only the changed hunks of kraming.py and Baser.clean(). Claims outside those regions keep their
