    caveat: >-
      Sam's rulings in issue and pull-request comment threads, which neither keripy-discussions nor
      keripy-prs (merged-PR titles) captures. A thread is flagged when an `involves:` search finds him in
      it; whether GitHub counts a PR review comment as involvement is unverified. Rulings reverse within
