      no commit anywhere. Snapshotting (refresh/snapshot-discussions.py) is what makes those quotes
      re-verifiable. Watch BOTH vocabularies for a topic: "presentation registry" misses #1095,
      which invents the idea under the name "issuee usage registry". #1515, #1550, #1566, #1570, #1573, #1574
      and #1598 carry delegation, registry and bulk-issuance rulings (raw/21), and the #1512 body is stale
      against its own later comments (raw/21 R-027).

