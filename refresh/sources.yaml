# sources.yaml — the bible's source manifest and watermark.
#
# Every doctrinal source the bible rests on, with a pin recording how far it has been read.
# refresh/detect.py reads this file to work out what has moved since the last pass; the
# monthly refresh PR updates the pins. Nothing else should edit it by hand except the
# REVIEWED fields called out below.
#
# FIELDS
#   id            stable key, used in delta reports and state files
#   kind          git | gh-discussions | gh-prs | gh-issues | gh-repo | web
#                 refresh/freshness.py reads only `git` sources, from their watched .md .py .ts
#                 .txt .json files plus .pdf (through pdftotext -layout) and .srt (caption text).
#                 The other kinds are watched for change by detect.py and are invisible to it.
#   path          repo location relative to $CODE_ROOT (default ~/code), per ~/code/repos.yaml
#   repo, repos   owner/name of a GitHub source; gh-issues takes either one `repo` or a `repos` list
#   urls          web sources: each a URL, hashed on its visible text, or {url, match}, hashed on
#                 what `match` (a regex or a list of them) selects from the HTML with comments
#                 removed, for a page whose changing part is inside a script. Each regex must match
#                 exactly one distinct value, or the source is an error
#   since         gh-* conversation sources: report items updated on or after this date
#   primary_authors  gh-discussions and gh-issues: logins whose threads are flagged, and for
#                 gh-issues the only threads that make the source material
#   remote        git remote to fetch and resolve branches against
#   watch         paths within the repo that carry doctrine; changes elsewhere are noise
#   check         monthly = every run | quarterly = only runs in Jan/Apr/Jul/Oct
#   branches      one entry per tracked line. Specs carry TWO, and they are not interchangeable:
#                   role: standardizing  — what the community is standardizing now. Marker [spec].
#                   role: forward        — new thinking likely, not certain, to fold into the
#                                          next standard. Marker [spec-next].
#                 last_scanned advances every run. last_mined advances ONLY when a note was
#                 actually re-read against that commit. Never advance last_mined for a change
#                 triaged as noise — the manifest must not claim a reading nobody did.
#   feeds         the raw/ mining note(s) this source is extracted into
#   chapters      bible/ chapters that depend on it, so propagation is mechanical
#   caveat        free text; anything the pins would otherwise over-claim
#
# REVIEWED FIELDS — a refresh run may PROPOSE changes to these in the PR body, never apply them
# itself: `branches` (which lines are tracked), `chapters` (the propagation map), `check`.
# Rationale: on 2026-09-15 the ACDC spec's v1.1 branch was 491 lines of spec-body.md ahead of
# main and nothing tracked it. A job that silently retargets its own sources can drift the same
# way without anyone noticing it happened.
#
# unknown = mined before pinning existed. The first run treats it as a full re-anchor, not a delta.

version: 1
code_root: ~/code

sources:

  # ---------------------------------------------------------------- specifications

  - id: keri-spec
    kind: git
    path: wot/kswg-keri-specification
    remote: upstream
    watch: [spec/spec-body.md, spec/termdefs.md, spec/terms-and-definitions-intro.md, spec/terms-definitions]
    check: monthly
    branches:
      - {name: main, role: standardizing, marker: "[spec]",
         last_scanned: {commit: fbdd4a615, date: 2026-10-03},
         last_mined:   {commit: fbdd4a615, date: 2026-09-15}}
      - {name: v1.1, role: forward, marker: "[spec-next]",
         last_scanned: {commit: 3753f3797, date: 2026-10-03},
         last_mined:   {commit: 3753f3797, date: 2026-09-15}}
    feeds: [raw/01-keri-spec.md]
    chapters: ["01", "02", "03", "04", "06", "07", "09"]
    caveat: >-
      Both lines mined 2026-09-15 and the note now carries its own pins. The branches have DIVERGED —
      neither commit is an ancestor of the other — so a citation here must name its branch. Note also
      that spec-head.md reads "Specification Status: v1.1" on BOTH branches, so this corpus's
      [spec]/[spec-next] split tracks the git line, not the document's own version label.

  - id: cesr-spec
    kind: git
    path: me/kswg-cesr-specification
    remote: upstream
    watch: [spec/spec-body.md, spec/terms-and-definitions-intro.md, spec/terms-definitions]
    check: monthly
    branches:
      - {name: main, role: standardizing, marker: "[spec]",
         last_scanned: {commit: bad6edd84, date: 2026-10-03},
         last_mined:   {commit: bad6edd84, date: 2026-09-15}}
      - {name: v1.1, role: forward, marker: "[spec-next]",
         last_scanned: {commit: 65fd7518b, date: 2026-10-03},
         last_mined:   {commit: 65fd7518b, date: 2026-09-15}}
    feeds: [raw/02-cesr-spec.md]
    chapters: ["04", "07"]
    caveat: >-
      The previous pin d35125e is UNREACHABLE from every ref in the repo — `git branch -a --contains`
      returns nothing — so the 2026-07-17 citations rested on a commit that no longer exists on any
      branch. Both lines re-mined 2026-09-15. A pin that cannot be resolved is worse than no pin,
      because it reads as provenance; check reachability when recording one.

  - id: acdc-spec
    kind: git
    path: me/kswg-acdc-specification
    remote: upstream
    watch: [spec/spec-body.md, spec/terms-and-definitions-intro.md, spec/terms-definitions]
    check: monthly
    branches:
