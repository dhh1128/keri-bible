         last_mined:   {commit: 5a174b545, date: 2026-10-03}}
    feeds: [raw/10-keria-signify.md]
    chapters: ["03", "06"]
    caveat: >-
      RETARGETED 2026-09-15, development -> main, by hand after the refresh flagged it. `development`
      is a real branch and genuinely the head of that name, but it has not moved since 2024-04-12;
      the project develops on `main` (ffba8406e, 2026-09-10). A pin on a dormant branch is the
      failure this manifest exists to prevent, wearing a valid commit hash. ffba8406e was
      SPOT-CHECKED, not fully re-read — raw/10 says which claims that covers. Note also that the
      CESR post-quantum and stream-parser work is NOT upstream: those commits live only on
