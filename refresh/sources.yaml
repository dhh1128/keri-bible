      (keri==1.2.14), not this line — see raw/10 §11a. raw/17 (spac/, app/forwarding.py, app/keeping.py,
      peer/exchanging.py, core/counting.py) and raw/18 (app/agenting.py, app/indirecting.py) cite the files
      they read at 927c0cb87, which is ahead of last_mined; those readings cover only the files named.

