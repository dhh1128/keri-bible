  - id: utah-sedi-statute
    kind: web
    urls:
      # The version list is JavaScript, so the visible text would never change; hash it instead.
      - url: https://le.utah.gov/xcode/Title63A/Chapter20/63A-20.html
        match: ['var versionArr = \[.*?\];', 'var versionDefault="[^"]*"']
    check: quarterly
    feeds: [raw/20-identity-theory-reputation-sedi.md]
    chapters: ["06"]
    caveat: >-
      Utah Code 63A-20, State-Endorsed Digital Identity, enacted by Chapter 436, 2026 General Session,
      effective 2026-05-06. Law, not a kind of evidence the markers name, so this source has no branch and
      no marker. raw/20 mines the official PDF C63A-20_2026050620260506.pdf held in the private repo
      bakobo/sedi at 91402ae99, not this page. The page is a script shell: the statute text loads from a
      versioned file, and the version list naming it, which holds C63A-20_2026050620260506 as the only and
      current version, is JavaScript. So this source hashes that list rather than the visible text, and an
      amendment, which adds a version, moves the hash while a site banner does not. The talks call the
      bill SB 260; the bill number is unverified (raw/20 §4.1). Invisible to freshness.py.
