      deletions by b47f21597), and raw/15 is not re-read against the change. WebOfTrust/kram's README is an
      earlier, shorter subset of kram.md; cite the Papers version. PDFs are read as `pdftotext -layout`
      renders them, so cite a page or slide rather than a line, and expect the extractor to split a
      sentence or drop fi/ff ligatures. keridemlia.pdf has a broken text layer, so raw/18 quotes it from OCR
      and freshness cannot match those quotes. The open-reputation papers are read for their headers only,
      so treat them as unread. UniversalIdentifierTheory.pdf and IdentifierTheory_web.pdf are the same
      blob. SPAC_Message.md's version string (0.5.3) does not track its content; cite by commit.
      Revocation.md states a TEL transfer event in the present tense that is in neither ACDC branch.
      SPAC_Strawman, TSPSlides20230208 and SustainablePrivacySlides are superseded by the decks watched
      here and are not watched. ManyCubed.md, KERI_AlphaOmega and the DAD architecture deck (raw/19) and
